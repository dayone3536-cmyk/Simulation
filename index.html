<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forest Village</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2f5a1a; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,28,0,.38) 100%); }
  #hint { position: fixed; left: 14px; bottom: 12px; font: 13px system-ui, sans-serif; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; transition: opacity .6s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hint">Drag to look around, scroll or pinch to zoom</div>

<script>
(() => {
  // ---- tune these ----
  const HALF_W = 640;           // half the width of the clearing (clearing is 1280 wide)
  const HALF_H = 400;           // half the height of the clearing (800 tall)
  const BAND = 600;             // how deep the forest is around the clearing
  const MARGIN = 260;           // how far past the clearing edge the camera may look
  const COL = 108, ROW = 84;     // tree spacing: bigger numbers = fewer trees
  // --------------------
  const CELL = 40;              // size of one checker square (the clearing is 32 x 20 squares; also the future build grid)
  const TILE = 512;             // grass detail tile
  const MACRO = 1024;           // large soft light/dark blotches (hides tiling)
  const WORLD_W = 2 * (HALF_W + BAND), WORLD_H = 2 * (HALF_H + BAND);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  // ---------- seeded random ----------
  let seed = (Math.random() * 2 ** 32) >>> 0;
  function rng() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  const rr = (a, b) => a + rng() * (b - a);

  // ---------- tileable value noise ----------
  function makeNoise(cells) {
    const g = new Float32Array(cells * cells);
    for (let i = 0; i < g.length; i++) g[i] = rng();
    return (u, v) => {
      const x = u * cells, y = v * cells;
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const fx = x - x0, fy = y - y0;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const xa = x0 % cells, xb = (x0 + 1) % cells, ya = y0 % cells, yb = (y0 + 1) % cells;
      const a = g[ya * cells + xa], b = g[ya * cells + xb], c = g[yb * cells + xa], d = g[yb * cells + xb];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  }

  // ---------- procedural grass (the Clash of Clans look: saturated, mottled, tufted) ----------
  function makeGrass() {
    const c = document.createElement('canvas');
    c.width = c.height = TILE;
    const g = c.getContext('2d');

    // 1) mottled base from layered noise mapped onto a dark -> light green ramp
    const img = g.createImageData(TILE, TILE), d = img.data;
    const n = [makeNoise(4), makeNoise(8), makeNoise(16), makeNoise(48)];
    const ramp = [[26, 70, 16], [34, 86, 20], [44, 100, 24], [58, 116, 30]];   // dark forest floor
    for (let y = 0; y < TILE; y++) {
      for (let x = 0; x < TILE; x++) {
        const u = x / TILE, v = y / TILE;
        let t = .40 * n[0](u, v) + .28 * n[1](u, v) + .20 * n[2](u, v) + .12 * n[3](u, v);
        t = Math.max(0, Math.min(.999, (t - .5) * .9 + .5)) * 3;
        const i = t | 0, f = t - i, a = ramp[i], b = ramp[i + 1];
        const o = (y * TILE + x) * 4;
        d[o] = a[0] + (b[0] - a[0]) * f;
        d[o + 1] = a[1] + (b[1] - a[1]) * f;
        d[o + 2] = a[2] + (b[2] - a[2]) * f;
        d[o + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);

    // draw something so it wraps across tile edges (keeps the tile seamless)
    function wrapped(x, y, fn) {
      const xs = [x], ys = [y], m = 24;
      if (x < m) xs.push(x + TILE); else if (x > TILE - m) xs.push(x - TILE);
      if (y < m) ys.push(y + TILE); else if (y > TILE - m) ys.push(y - TILE);
      for (const px of xs) for (const py of ys) fn(px, py);
    }

    // 2) grass tufts: little fans of blades, dark base stroke then lighter tip stroke
    g.lineCap = 'round';
    for (let i = 0; i < 500; i++) {
      const x = rr(0, TILE), y = rr(0, TILE), len = rr(5, 11), lit = rng();
      wrapped(x, y, (px, py) => {
        for (const lean of [-.45, 0, .45]) {
          const bx = px + lean * 3, tx = bx + lean * len * .7 + rr(-1, 1), ty = py - len * (lean === 0 ? 1 : .75);
          g.strokeStyle = 'rgba(30,84,20,.55)'; g.lineWidth = 1.8;
          g.beginPath(); g.moveTo(bx, py + 1); g.lineTo(tx, ty + 1); g.stroke();
          g.strokeStyle = lit > .55 ? 'rgba(96,160,48,.55)' : 'rgba(70,134,38,.55)'; g.lineWidth = 1.2;
          g.beginPath(); g.moveTo(bx, py); g.lineTo(tx, ty); g.stroke();
        }
      });
    }

    return c;
  }


  // sparse tufts + clover for the lawn; transparent, and exactly 12 squares wide so it never fights the checker
  const DETAIL = CELL * 12;
  function makeDetail() {
    const c = document.createElement('canvas');
    c.width = c.height = DETAIL;
    const g = c.getContext('2d');
    g.lineCap = 'round';
    function wrapped(x, y, fn) {
      const xs = [x], ys = [y], m = 16;
      if (x < m) xs.push(x + DETAIL); else if (x > DETAIL - m) xs.push(x - DETAIL);
      if (y < m) ys.push(y + DETAIL); else if (y > DETAIL - m) ys.push(y - DETAIL);
      for (const px of xs) for (const py of ys) fn(px, py);
    }
    for (let i = 0; i < 260; i++) {
      const x = rr(0, DETAIL), y = rr(0, DETAIL), len = rr(4, 8), lit = rng() > .5;
      wrapped(x, y, (px, py) => {
        for (const lean of [-.5, 0, .5]) {
          const tx = px + lean * len * .8, ty = py - len * (lean === 0 ? 1 : .72);
          g.strokeStyle = lit ? 'rgba(40,110,20,.30)' : 'rgba(30,96,16,.34)'; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(px, py + 1); g.lineTo(tx, ty + 1); g.stroke();
          g.strokeStyle = lit ? 'rgba(200,244,120,.55)' : 'rgba(150,214,70,.50)'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(px, py); g.lineTo(tx, ty); g.stroke();
        }
      });
    }
    const flowers = ['#fff6d8', '#ffe45c', '#ffffff'];
    for (let i = 0; i < 14; i++) {
      const x = rr(4, DETAIL - 4), y = rr(4, DETAIL - 4);
      g.fillStyle = 'rgba(30,84,20,.35)'; g.beginPath(); g.arc(x, y + 1, 1.7, 0, 7); g.fill();
      g.fillStyle = flowers[(rng() * flowers.length) | 0]; g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill();
    }
    return c;
  }

  // soft light/dark blotches at a different tile size than the detail tile
  function makeMacro() {
    const c = document.createElement('canvas');
    c.width = c.height = MACRO;
    const g = c.getContext('2d');
    const img = g.createImageData(MACRO, MACRO), d = img.data;
    const n = [makeNoise(3), makeNoise(6), makeNoise(12)];
    for (let y = 0; y < MACRO; y++) {
      for (let x = 0; x < MACRO; x++) {
        const u = x / MACRO, v = y / MACRO;
        const t = .55 * n[0](u, v) + .30 * n[1](u, v) + .15 * n[2](u, v);
        const o = (y * MACRO + x) * 4;
        if (t < .5) { d[o] = 14; d[o + 1] = 62; d[o + 2] = 10; d[o + 3] = Math.min(255, (.5 - t) * 2 * 255 * .9); }
        else { d[o] = 210; d[o + 1] = 244; d[o + 2] = 110; d[o + 3] = Math.min(255, (t - .5) * 2 * 255 * .6); }
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  // ---------- tree atlas (sliced from your sprite sheet) ----------
  // [x, y, w, h] of each green tree inside trees.png
  const R = [
    [0, 0, 77, 93]      // 0 the oak: layered lime broadleaf (the only tree)
  ];
  const atlas = new Image();

  // ---------- world ----------
  const spawn = { x: WORLD_W / 2, y: WORLD_H / 2 };          // your base, centre of the clearing
  const clearing = { x0: spawn.x - HALF_W, y0: spawn.y - HALF_H, x1: spawn.x + HALF_W, y1: spawn.y + HALF_H };
  const trees = [];

  function inClearing(x, y, r, h, shrink) {
    // base must be outside the rectangle, and canopies of trees standing just
    // below the bottom edge must not reach up into it. `shrink` lets a tree
    // creep a little way inside, which makes the edge ragged instead of a ruler line
    return x > clearing.x0 - r + shrink && x < clearing.x1 + r - shrink &&
           y > clearing.y0 - r + shrink && y < clearing.y1 + h * .55 - shrink;
  }
  function add(x, y, k, s) {
    const shrink = rng() < .45 ? rr(0, 80) : 0;
    if (inClearing(x, y, R[k][2] * s * .36, R[k][3] * s, shrink)) return;
    trees.push({ x, y, k, s, flip: rng() < .5 ? -1 : 1, ph: rr(0, 6.28) });
  }
  // loose rows: a rough grid that wanders, with gaps and size changes
  function growForest() {
    const rMin = -Math.ceil(spawn.y / ROW) - 1, rMax = Math.ceil((WORLD_H + 100 - spawn.y) / ROW);
    const cMin = -Math.ceil(spawn.x / COL) - 1, cMax = Math.ceil((WORLD_W - spawn.x) / COL) + 1;
    for (let r = rMin; r <= rMax; r++) {
      const rowY = spawn.y + r * ROW;
      if (rowY < 30) continue;                                 // rows above the map edge are never seen
      const wobble = Math.sin(r * 1.7) * 12 + rr(-6, 6);       // each row drifts sideways a bit
      for (let c = cMin; c <= cMax; c++) {
        const x = spawn.x + (c + (r & 1 ? .5 : 0)) * COL + wobble;
        const y = rowY + Math.sin(c * .9 + r) * 6;
        if (rng() > .08) {                                     // ~1 in 12 spots stays empty
          add(x + rr(-18, 18), y + rr(-14, 14), 0, rr(.88, 1.18));
        }
      }
    }
    trees.sort((a, b) => a.y - b.y);
  }

  // ---------- camera ----------
  let dpr = 1, cw = 0, ch = 0;
  let zoom = 1, camX = 0, camY = 0;
  const minZoom = () => Math.min(1.6, Math.max(.25, cw / WORLD_W, ch / WORLD_H));
  function clampCam() {
    zoom = Math.max(minZoom(), Math.min(1.6, zoom));
    const vw = cw / zoom, vh = ch / zoom;
    // the view may reach MARGIN px past the clearing, no further; if the screen is
    // bigger than that area (zoomed out) it simply stays centred on the base
    const ax0 = clearing.x0 - MARGIN, ax1 = clearing.x1 + MARGIN;
    const ay0 = clearing.y0 - MARGIN, ay1 = clearing.y1 + MARGIN;
    camX = vw >= ax1 - ax0 ? spawn.x - vw / 2 : Math.max(ax0, Math.min(ax1 - vw, camX));
    camY = vh >= ay1 - ay0 ? spawn.y - vh / 2 : Math.max(ay0, Math.min(ay1 - vh, camY));
    camX = Math.max(0, Math.min(WORLD_W - vw, camX));
    camY = Math.max(0, Math.min(WORLD_H - vh, camY));
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth; ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    clampCam();
  }
  window.addEventListener('resize', resize);

  // pointer: drag + pinch
  const ptrs = new Map(); let pinchD = 0;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('drag'); hint.style.opacity = 0;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) {
      camX -= (e.clientX - p.x) / zoom; camY -= (e.clientY - p.y) / zoom;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, zoom * dist / pinchD); pinchD = dist;
    }
    clampCam();
  });
  const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) canvas.classList.remove('drag'); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  function zoomAt(sx, sy, z) {
    const wx = camX + sx / zoom, wy = camY + sy / zoom;
    zoom = Math.max(minZoom(), Math.min(1.6, z));
    camX = wx - sx / zoom; camY = wy - sy / zoom;
  }
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); hint.style.opacity = 0;
    zoomAt(e.clientX, e.clientY, zoom * Math.exp(-e.deltaY * .0012)); clampCam();
  }, { passive: false });

  // ---------- render ----------
  let grassTile, macroTile, detailTile, grassPat, macroPat, detailPat, started = false;
  function fillPattern(pat, alpha) {
    // a pattern lives in the canvas's current coordinate space, so drawing it
    // under the camera transform tiles it in world space with no seams
    const s = zoom * dpr;
    ctx.setTransform(s, 0, 0, s, -camX * s, -camY * s);
    ctx.globalAlpha = alpha; ctx.fillStyle = pat;
    ctx.fillRect(camX, camY, cw / zoom + 1, ch / zoom + 1);
    ctx.globalAlpha = 1;
  }
  // Clash-style lawn: a clean two-tone checker, only inside the clearing. The forest floor
  // around it stays dark, so the lawn reads as a cut, tended square.
  const LIGHT = '#acdf50', DARK = '#84c238';
  function drawClearing() {
    const s = zoom * dpr, vw = cw / zoom, vh = ch / zoom;
    const { x0, y0, x1, y1 } = clearing, w = x1 - x0, h = y1 - y0;
    ctx.setTransform(s, 0, 0, s, -camX * s, -camY * s);

    // dim the forest floor and let the lawn cast a soft shadow onto it
    ctx.fillStyle = 'rgba(4,28,3,.30)'; ctx.fillRect(camX, camY, vw + 1, vh + 1);
    ctx.save();
    ctx.shadowColor = 'rgba(0,18,0,.55)'; ctx.shadowBlur = 30 * s;
    ctx.fillStyle = LIGHT; ctx.fillRect(x0, y0, w, h);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
    // light base, then only the dark squares on top (no seams between squares)
    ctx.fillStyle = LIGHT; ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = DARK;
    const c0 = Math.max(Math.floor(x0 / CELL), Math.floor(camX / CELL)), c1 = Math.min(Math.ceil(x1 / CELL), Math.ceil((camX + vw) / CELL));
    const r0 = Math.max(Math.floor(y0 / CELL), Math.floor(camY / CELL)), r1 = Math.min(Math.ceil(y1 / CELL), Math.ceil((camY + vh) / CELL));
    for (let r = r0; r < r1; r++)
      for (let c = c0; c < c1; c++)
        if ((r + c) & 1) ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    // faint large-scale light variation so it is not flat vector, then grass tufts
    ctx.globalAlpha = .06; ctx.fillStyle = macroPat; ctx.fillRect(x0, y0, w, h);
    ctx.globalAlpha = 1; ctx.fillStyle = detailPat; ctx.fillRect(x0, y0, w, h);
    // soft inner edge where the lawn meets the trees
    const E = 46;
    for (const [gx0, gy0, gx1, gy1, rx, ry, rw, rh] of [
      [x0, 0, x0 + E, 0, x0, y0, E, h], [x1, 0, x1 - E, 0, x1 - E, y0, E, h],
      [0, y0, 0, y0 + E, x0, y0, w, E], [0, y1, 0, y1 - E, x0, y1 - E, w, E]]) {
      const g = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
      g.addColorStop(0, 'rgba(18,70,10,.34)'); g.addColorStop(1, 'rgba(18,70,10,0)');
      ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(40,96,18,.75)'; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, w, h);
  }
  function firstIndexBelow(y) {            // first tree whose base y >= y
    let lo = 0, hi = trees.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (trees[m].y < y) lo = m + 1; else hi = m; }
    return lo;
  }

  function frame(ms) {
    const time = ms / 1000, s = zoom * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    fillPattern(grassPat, 1);
    fillPattern(macroPat, .12);
    drawClearing();                          // light / dark checker lawn inside the clearing

    const vw = cw / zoom, vh = ch / zoom;
    const x0 = camX - 140, x1 = camX + vw + 140;
    const i0 = firstIndexBelow(camY - 4), i1 = firstIndexBelow(camY + vh + 160);

    ctx.setTransform(s, 0, 0, s, -camX * s, -camY * s);

    // shadows first, so every canopy sits above every shadow
    for (let i = i0; i < i1; i++) {
      const t = trees[i]; if (t.x < x0 || t.x > x1) continue;
      const w = R[t.k][2] * t.s;
      const g = ctx.createRadialGradient(t.x, t.y - 2, 1, t.x, t.y - 2, w * .5);
      g.addColorStop(0, 'rgba(8,36,6,.50)'); g.addColorStop(1, 'rgba(8,36,6,0)');
      ctx.save(); ctx.translate(t.x, t.y - 2); ctx.scale(1, .42); ctx.translate(-t.x, -(t.y - 2));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y - 2, w * .5, 0, 7); ctx.fill(); ctx.restore();
    }

    // trees, back to front, each with a slight wind sway
    for (let i = i0; i < i1; i++) {
      const t = trees[i]; if (t.x < x0 || t.x > x1) continue;
      const [sx, sy, sw, sh] = R[t.k], w = sw * t.s, h = sh * t.s;
      const sway = Math.sin(time * 1.1 + t.ph) * .02;
      ctx.setTransform(t.flip * s, 0, sway * s, s, (t.x - camX) * s, (t.y - camY) * s);
      ctx.drawImage(atlas, sx, sy, sw, sh, -w / 2, -h + 3 * t.s, w, h);
    }
    requestAnimationFrame(frame);
  }

  atlas.onload = () => {
    if (started) return; started = true;
    grassTile = makeGrass(); macroTile = makeMacro();
    grassPat = ctx.createPattern(grassTile, 'repeat');
    macroPat = ctx.createPattern(macroTile, 'repeat');
    detailTile = makeDetail(); detailPat = ctx.createPattern(detailTile, 'repeat');
    growForest();
    resize();
    zoom = Math.min(cw / (HALF_W * 2 + 120), ch / (HALF_H * 2 + 120));   // whole clearing fits on screen
    camX = spawn.x - cw / zoom / 2; camY = spawn.y - ch / zoom / 2; clampCam();
    requestAnimationFrame(frame);
    window.game = { spawn, clearing, trees, WORLD_W, WORLD_H, CELL };   // hooks for the next step (cutting trees, farms, houses)
  };
  atlas.onerror = () => { hint.textContent = 'trees.png not found. Put it in the same folder as index.html'; hint.style.opacity = 1; };
  atlas.src = 'trees.png';
})();
</script>
</body>
</html>
