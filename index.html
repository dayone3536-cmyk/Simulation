<head>

  <div id="stats"><h4>Village</h4></div>
  <div id="toast"></div>
  <div id="buildpanel"><div class="bt">Build</div><div class="bcard"><span class="bi" data-ic="wheat"></span><div class="bm"><b>Wheat Farm</b><small id="farmInfo"></small></div><button id="farmBuy"></button></div></div>

  <button id="tradebtn" aria-label="Trade">Trade</button>
  <div id="tradepanel" aria-hidden="true">
    <div class="bt">Trade</div>
    <div id="tradeMsg"></div>
    <label id="tradeRow" for="tradeRange">
      <span>Food to trade</span>
      <span id="tradeAmt">0</span>
    </label>
    <input id="tradeRange" type="range" min="0" max="0" value="0" step="1">
    <div id="tradeGet"></div>
    <div class="tradeActions">
      <button id="tradeCancel" type="button">Close</button>
      <button id="tradeConfirm" type="button">Trade</button>
    </div>
  </div>
  <div id="movebar"><button class="no" id="mvNo" aria-label="Cancel move" data-ic="cross"></button><div id="mvMsg"></div><button class="rot" id="mvRot" aria-label="Rotate" title="Rotate">&#x27F3;</button><button class="ok" id="mvOk" aria-label="Place" data-ic="check"></button></div>
</div>
<div id="hint">Drag to look around, pinch to zoom, tap your cabin to move it</div>
<script>
  window.addEventListener('error', function(e){ var h=document.getElementById('hint'); if(h){ h.textContent='Error: '+(e.message||e.error||'unknown'); h.style.opacity=1; h.style.color='#ffb0a8'; } });
  window.addEventListener('unhandledrejection', function(e){ var h=document.getElementById('hint'); if(h){ var r=e.reason; h.textContent='Error: '+(r&&r.message||r||'unknown'); h.style.opacity=1; h.style.color='#ffb0a8'; } });
</script>

</html>
