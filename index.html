<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Forest Village</title>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #143310; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 66%, rgba(10,50,0,.28) 100%); }
  #info { display: none; position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 12px 10px 16px; border-radius: 16px;
    background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b; box-shadow: 0 6px 18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,180,.35);
    color: #fff3d6; font: 600 14px system-ui, sans-serif; white-space: nowrap; align-items: center; gap: 14px; animation: pop .18s ease-out; }
  #info small { display: block; font-weight: 500; font-size: 11px; opacity: .7; margin-top: 2px; }
  #info button { border: 0; border-radius: 10px; padding: 9px 14px; font: 700 13px system-ui, sans-serif; color: #2a1a05; background: linear-gradient(#ffe27a, #f0a92b); box-shadow: 0 2px 0 #9a6410; }
  #info button:active { transform: translateY(2px); box-shadow: none; }
  #info button.x { background: none; box-shadow: none; color: #fff3d6; padding: 6px 8px; font-size: 18px; opacity: .7; }
  /* move bar: appears while the cabin is selected (Clash-of-Clans style) */
  #movebar { display: none; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); pointer-events: auto;
    align-items: center; gap: 12px; padding: 8px 10px; border-radius: 18px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b;
    box-shadow: 0 6px 18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,180,.35); color: #fff3d6; font: 700 14px system-ui, sans-serif; animation: pop .18s ease-out; max-width: calc(100% - 130px); }
  #movebar button { width: 54px; height: 54px; flex: none; border: 3px solid rgba(0,0,0,.45); border-radius: 16px; font: 800 28px system-ui, sans-serif; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #movebar .ok { background: linear-gradient(#7be25a, #2fa12b); box-shadow: 0 4px 0 #1b6a1a; }
  #movebar .no { background: linear-gradient(#ff8a7a, #d23a2c); box-shadow: 0 4px 0 #8c1f16; }
  #movebar .rot { display: none; background: linear-gradient(#ffe27a, #e2a11f); box-shadow: 0 4px 0 #8f6410; color: #3a2405; }
  #movebar.placing .rot { display: block; }
  #movebar button:active { transform: translateY(3px); box-shadow: none; }
  #movebar.bad .ok { background: linear-gradient(#8a8a8a, #5f5f5f); box-shadow: 0 4px 0 #3a3a3a; opacity: .6; }
  #movebar #mvMsg { min-width: 150px; text-align: center; line-height: 1.25; }
  #movebar #mvMsg small { display: block; font-weight: 500; font-size: 11px; opacity: .75; }
  #movebar.bad #mvMsg { color: #ff9d92; }
  #movebar.shake { animation: shake .3s; }
  @keyframes shake { 20%, 60% { transform: translateX(calc(-50% - 6px)); } 40%, 80% { transform: translateX(calc(-50% + 6px)); } }
  @keyframes pop { from { transform: translateX(-50%) translateY(14px) scale(.94); opacity: 0; } }
  #hint { position: fixed; left: 14px; bottom: 12px; font: 13px system-ui, sans-serif; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; transition: opacity .6s; }
  /* Phone held upright (or rotation locked): the whole game turns 90 degrees, so it always plays sideways */
  canvas.rot { position: fixed; left: 0; top: 0; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
  canvas.rot.flip { transform: rotate(-90deg) translateX(-100%); }
  #flip { display: none; position: fixed; left: 12px; top: 12px; z-index: 5; padding: 8px 12px; border: 0; border-radius: 10px;
    background: rgba(0,0,0,.45); color: #fff; font: 600 13px system-ui, sans-serif; }
  /* HUD: gold bar (top right) and Build button (bottom right). Turns with the game when the phone is upright. */
  #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  #hud.rot { transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
  #hud.rot.flip { transform: rotate(-90deg) translateX(-100%); }
  #topright { position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  #goldbar { position: relative; display: flex; align-items: center; gap: 8px;
    min-width: 96px; padding: 4px 14px 4px 4px; border-radius: 999px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b;
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,235,180,.35); color: #f4efe2; font: 800 17px system-ui, sans-serif; }
  /* flat coin: no shiny gradient. To use a real sprite later, set background: url(coin.png) center/contain no-repeat and drop the border */
  #goldbar .coin { width: 32px; height: 32px; flex: none; margin: -3px -2px -3px 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
  [data-ic] svg { width: 100%; height: 100%; display: block; }
  #moreBtn { pointer-events: auto; width: 38px; height: 38px; padding: 0; border-radius: 50%; cursor: pointer; border: 2px solid #c99a4b; background: linear-gradient(#3b2a18, #261a0e);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,235,180,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  #moreBtn i { width: 5px; height: 5px; border-radius: 50%; background: #f4efe2; }
  #moreBtn:active, #moreBtn.open { background: linear-gradient(#5a4126, #3b2a18); }
  #stats { display: none; pointer-events: auto; position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(58px + env(safe-area-inset-top)); width: 230px; max-width: calc(100% - 24px);
    padding: 8px 12px 10px; border-radius: 16px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b; box-shadow: 0 8px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,180,.35);
    color: #ffe9c0; font: 700 15px system-ui, sans-serif; }
  #stats h4 { margin: 2px 0 6px; font: 800 12px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #c99a4b; }
  #stats .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(201,154,75,.25); }
  #stats .row .ic { width: 24px; height: 24px; flex: none; }
  #stats .row .ic svg { width: 100%; height: 100%; display: block; }
  #stats .row .lb { flex: 1; }
  #stats .row .vl { font-variant-numeric: tabular-nums; color: #ffe27a; }
  #goldnum { flex: 1; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #buildbtn { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); pointer-events: auto;
    width: 84px; height: 84px; border: 3px solid #7a4a08; border-radius: 22px; background: linear-gradient(#ffe27a, #f0a92b); box-shadow: 0 5px 0 #9a6410, 0 8px 16px rgba(0,0,0,.5);
    color: #2a1a05; font: 800 15px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; -webkit-tap-highlight-color: transparent; }
  #buildbtn svg { width: 42px; height: 42px; }
  #buildbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9a6410; }
  #buildpanel { display: none; position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(112px + env(safe-area-inset-bottom)); pointer-events: auto;
    padding: 14px 16px; border-radius: 16px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b; box-shadow: 0 6px 18px rgba(0,0,0,.55);
    color: #fff3d6; font: 600 14px system-ui, sans-serif; animation: pop2 .18s ease-out; }
  #movebar button svg { width: 32px; height: 32px; }
  #buildpanel small { display: block; font-weight: 500; font-size: 11px; opacity: .7; margin-top: 2px; }
  @keyframes pop2 { from { transform: translateY(14px) scale(.94); opacity: 0; } }
  .pill { pointer-events: none; display: none; align-items: center; gap: 6px; padding: 4px 14px 4px 8px; height: 38px; box-sizing: border-box; border-radius: 999px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b;
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,235,180,.35); color: #f4efe2; font: 800 15px system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #wheatpill .ico { width: 34px; height: 34px; flex: none; margin: -6px 0 -6px -6px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
  #toast { position: absolute; left: 50%; top: calc(62px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 9px 16px; border-radius: 14px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b;
    color: #fff3d6; font: 700 14px system-ui, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #buildpanel .bt { font: 800 12px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #c99a4b; margin-bottom: 10px; }
  #buildpanel .bcard { display: flex; align-items: center; gap: 12px; }
  #buildpanel .bi { width: 52px; height: 52px; flex: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  #buildpanel .bm b { font-size: 15px; }
  #farmBuy { border: 0; border-radius: 10px; padding: 11px 14px; min-width: 96px; font: 800 14px system-ui, sans-serif; color: #2a1a05; background: linear-gradient(#ffe27a, #f0a92b); box-shadow: 0 2px 0 #9a6410; cursor: pointer; }
  #farmBuy:active { transform: translateY(2px); box-shadow: none; }
  #farmBuy:disabled { filter: grayscale(1); opacity: .5; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="info"></div>
<button id="flip">Flip screen</button>
<div id="hud">
  <div id="topright"><div id="wheatpill" class="pill"><span class="ico" data-ic="wheat"></span><span id="wheatnum">0</span></div><div id="goldbar"><div class="coin" data-ic="coin"></div><div id="goldnum">...</div></div><button id="moreBtn" aria-label="Village details"><i></i><i></i><i></i></button></div>
  <div id="stats"><h4>Village</h4></div>
  <div id="toast"></div>
  <div id="buildpanel"><div class="bt">Build</div><div class="bcard"><span class="bi" data-ic="wheat"></span><div class="bm"><b>Wheat Farm</b><small id="farmInfo"></small></div><button id="farmBuy"></button></div></div>
  <button id="buildbtn" aria-label="Build"><svg viewBox="0 0 59.214 59.214" aria-hidden="true"><path fill="#010002" d="M28.693,25.135l-4.187-3.881c-1.003,2.072-2.365,3.81-4.543,4.672l3.361,3.626 c0.445-0.214,0.938-0.341,1.46-0.36L28.693,25.135z M19.131,24.136c0.004-0.023,0.003-0.045,0.008-0.069c0.098-0.464,0.36-0.954,0.776-1.371 l1.428-1.428c0.426-0.426,0.929-0.687,1.403-0.78c0.007-0.001,0.014-0.001,0.021-0.002l3.3-12.259L13.865,1.374L8.299,6.662 l8.717,5.491l-1.46,4.777l-4.777,1.46L5.288,9.673L0,15.239l6.853,12.202L19.131,24.136z M27.914,31.69l-0.277-0.275c-0.798-0.798-1.759-1.237-2.707-1.237c-0.715,0-1.373,0.263-1.85,0.74 L1.817,49.845c-0.541,0.542-0.892,1.422-0.919,2.335c-0.03,1.008,0.33,1.939,1.015,2.624l2.609,2.609 c0.707,0.707,1.731,1.112,2.812,1.112c0.95,0,1.833-0.315,2.361-0.844l18.89-21.219C29.705,35.342,29.388,33.167,27.914,31.69z M55.336,49.835L34.083,30.131l-3.857,4.004c0.11,0.863-0.024,1.702-0.433,2.393l18.689,20.16 c0.104,0.104,0.257,0.148,0.445,0.148c0.91,0,2.634-1.057,3.353-1.775l1.429-1.428C54.575,52.766,55.934,50.434,55.336,49.835z M49.207,53.448c-1.341,0-2.428-1.086-2.428-2.427s1.087-2.427,2.428-2.427c1.34,0,2.426,1.086,2.426,2.427 S50.546,53.448,49.207,53.448z M58.705,18.012c-0.68-0.68-1.781-0.68-2.461,0l-0.684,0.684c-0.566-0.782-1.505-2.111-1.391-2.551 c0.502-1.924-3.426-6.484-3.426-6.484c-9.76-9.76-16.283-9.54-19.384-8.472c-1.245,0.429-1.019,0.699,0.278,0.928 c9.406,1.642,10.58,7.194,8.984,9.338c-0.615,0.827-0.795,1.45-0.686,2.01c0.064,0.33,0.229,0.639,0.468,0.954L26.028,29.341 c0.831,0.224,1.629,0.679,2.315,1.366l0.277,0.276c0.606,0.607,1.031,1.306,1.304,2.023l14.214-14.751 c0.271,0.22,0.552,0.415,0.842,0.567c0.774,0.41,1.616,0.53,2.548,0.064c1.054-0.527,4.167,2.019,5.112,2.699 c0.007,0.005,0.013,0.007,0.02,0.012l-0.518,0.517c-0.68,0.68-0.68,1.781,0,2.461s1.781,0.68,2.461,0l4.102-4.102 C59.384,19.793,59.384,18.692,58.705,18.012z"/></svg>Build</button>
  <div id="movebar"><button class="no" id="mvNo" aria-label="Cancel move" data-ic="cross"></button><div id="mvMsg"></div><button class="rot" id="mvRot" aria-label="Rotate" title="Rotate">&#x27F3;</button><button class="ok" id="mvOk" aria-label="Place" data-ic="check"></button></div>
</div>
<div id="hint">Drag to look around, pinch to zoom, tap your cabin to move it</div>

<script>
(() => {
  // ---- tune these ----
  const HALF_W = 640;           // half the width of the clearing (world units, clearing is 1280 wide)
  const HALF_H = 400;           // half the height of the clearing (800 tall)
  const BAND = 1200;            // how deep the forest is around the clearing
  const MAX_RES = 1.5;          // phone sharpness: 1 = fastest, 2 = sharpest but heavier. (Auto-drops by itself if the phone is struggling)
  const VOID = '#143310';        // what lies past the edge of the map
  // --------------------
  const CELL = 80;              // one checker square = one future build tile
  const WORLD_W = 2 * (HALF_W + BAND), WORLD_H = 2 * (HALF_H + BAND);

  // Clash-style view: the flat world is rotated 45 degrees and squashed 2:1, so every
  // square becomes a diamond. World coordinates stay plain (x, y); only drawing changes.
  const IX = Math.SQRT1_2, IY = Math.SQRT1_2 / 2;
  const projX = (x, y) => (x - y) * IX;
  const projY = (x, y) => (x + y) * IY;
  const unprojX = (u, v) => (u / IX + v / IY) / 2;
  const unprojY = (u, v) => (v / IY - u / IX) / 2;

  // Phones: a tap asks Chrome for fullscreen + landscape lock (touch only counts as a "real" tap on release).
  // If the lock is refused, or auto-rotate is off, the game rotates itself instead, see resize().
  const coarse = matchMedia('(pointer: coarse)').matches;
  let locked = false, tries = 0, forced = false, flipped = false;
  function goLandscape() {
    if (!coarse || locked || tries++ > 4) return;
    const el = document.documentElement;
    Promise.resolve(el.requestFullscreen && el.requestFullscreen({ navigationUI: 'hide' }))
      .then(() => screen.orientation.lock('landscape'))
      .then(() => { locked = true; })
      .catch(() => {});
  }
  window.addEventListener('pointerup', goLandscape);
  window.addEventListener('orientationchange', () => setTimeout(() => window.dispatchEvent(new Event('resize')), 250));

  const canvas = document.getElementById('c');
  // ---------- Pixi.js (WebGL) renderer: the phone's GPU draws the scene, so it lags far less than the old 2D canvas ----------
  const PX = window.PIXI;
  let app = null;
  try {
    app = new PX.Application({ view: canvas, width: window.innerWidth, height: window.innerHeight, resolution: 1, autoDensity: true,
      antialias: false, backgroundColor: 0x143310, powerPreference: 'high-performance', autoStart: false, sharedTicker: false, hello: false });
    try { const ev = app.renderer.events; if (ev) { ev.autoPreventDefault = false; if (ev.features) ev.features.move = ev.features.globalMove = ev.features.click = ev.features.wheel = false; } } catch (e) {}   // we do our own touch handling
    app.stage.interactiveChildren = false;
  } catch (e) { console.error('Pixi failed to start', e); app = null; }
  const hint = document.getElementById('hint');
  if (!app) { hint.textContent = 'This browser could not start the graphics engine (WebGL / Pixi.js). Check your internet and try again.'; hint.style.opacity = 1; return; }
  let ctx = null;   // the 2D context of whichever villager canvas is being painted right now

  // scene graph, drawn bottom to top. Everything inside `world` lives in projected (screen-shaped) space; the camera is just world.position + world.scale.
  const world = app.stage.addChild(new PX.Container());
  const layer = () => world.addChild(new PX.Container());
  const groundL = layer(), farmFlatL = layer();
  const selG = world.addChild(new PX.Graphics());
  const gridG = world.addChild(new PX.Graphics()), footG = world.addChild(new PX.Graphics());
  const shadowL = layer(), treeL = layer(), farmL = layer();
  const vBack = layer(); vBack.sortableChildren = true;
  const homeL = layer();
  const vFront = layer(); vFront.sortableChildren = true;
  const overG = world.addChild(new PX.Graphics());
  let fc = 0;   // frame counter
  const bakeCanvas = (w, h, S) => { const cv = document.createElement('canvas'); cv.width = Math.ceil(w * S); cv.height = Math.ceil(h * S); return cv; };
  function radialTex(rgb, a0, size) {   // soft round blob, used for tree shadows and the selected-tree glow
    const cv = bakeCanvas(size, size, 1), g = cv.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
    gr.addColorStop(0, 'rgba(' + rgb + ',' + a0 + ')'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, size, size); return PX.Texture.from(cv);
  }
  let shadowTex = null, glowTex = null;

  async function initGold() {

    if (!ok) { setGold(50); return; }                          // not connected yet: just show the starting 50

      const { data: { session } } = await sb.auth.getSession();
      if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }   // same browser = same player

      setGold(data - goldPending); try { localStorage.setItem('goldCache', data - goldPending); } catch (e2) {}

      let c = 50; try { const v = parseInt(localStorage.getItem('goldCache'), 10); if (v >= 0) c = v; } catch (e2) {}
      setGold(c);
    }
  }

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  }

  }


  // ---------- the farm loop: buy it in the Build menu, villagers plant it, wait for the green bar, tap the bubble to collect the wheat ----------
  const FARM_COST = 50;            // gold to build it
  const GROW_SEC = 20;             // seconds until the wheat is ripe (try 10, 30 ...)
  const WHEAT_PER_HARVEST = 10;    // wheat you get each time you collect
  const WORKERS = 4;               // villagers who walk out and work the fields
  try {
    const saved = JSON.parse(localStorage.getItem('farms') || 'null');
    const old = saved ? null : JSON.parse(localStorage.getItem('farm') || 'null');   // older saves had a single farm
    const list = Array.isArray(saved) ? saved : (old && typeof old.t0 === 'number' ? [old] : []);
    for (const s of list) {
      if (!s || typeof s.t0 !== 'number') continue;
      const f = { t0: s.t0, c: Number.isInteger(s.c) ? s.c : 16, r: Number.isInteger(s.r) ? s.r : 21, rot: s.rot ? 1 : 0 };
      const cols = fCols(f.rot), rows = fRows(f.rot);
      f.c = Math.max(0, Math.min(WORLD_W / CELL - cols, f.c));
      f.r = Math.max(0, Math.min(WORLD_H / CELL - rows, f.r));
      farms.push(f);
    }
    const w = parseInt(localStorage.getItem('wheat'), 10); if (w > 0) wheatCount = w;
  } catch (e) {}
  const farmState = f => !f ? 'none' : (Date.now() - f.t0 >= GROW_SEC * 1000 ? 'ready' : 'growing');
  const farmProgress = f => f ? Math.min(1, (Date.now() - f.t0) / (GROW_SEC * 1000)) : 0;
  const saveFarms = () => { try { localStorage.setItem('farms', JSON.stringify(farms.map(f => ({ t0: f.t0, c: f.c, r: f.r, rot: f.rot })))); localStorage.setItem('wheat', wheatCount); } catch (e) {} };

  const toastEl = document.getElementById('toast'); let toastT = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200); }
  function spendGold(n) {
    if (gold < n) return false;
    setGold(gold - n); goldPending += n;
    try { localStorage.setItem('goldPending', goldPending); localStorage.setItem('goldCache', gold); } catch (e) {}
    if (sb) sb.rpc('spend_gold', { amount: n }).then(({ data, error }) => {     // needs a spend_gold function in Supabase; until it exists the spend is remembered here
      if (!error && typeof data === 'number') { goldPending = Math.max(0, goldPending - n); try { localStorage.setItem('goldPending', goldPending); } catch (e) {} }
      else console.warn('spend_gold not available yet', error && error.message);
    }).catch(() => {});
    return true;
  }

  // where a farm hand heads next: first visit = their own stretch of the field, later = a short shuffle along it
  function workSpot(v, near, f) {
    const b = f && farmBounds(f); if (!b) return;
    const cl = (a, lo, hi) => Math.max(lo, Math.min(hi, a));
    if (near) { v.tx = cl(v.x + rr(-80, 80), b.x0 + 16, b.x1 - 16); v.ty = cl(v.y + rr(-40, 40), b.y0 + 14, b.y1 - 14); }
    else { v.tx = cl(b.x0 + 40 + (v.wi % WORKERS) / (WORKERS - 1 || 1) * (b.x1 - b.x0 - 80) + rr(-25, 25), b.x0 + 16, b.x1 - 16); v.ty = b.y0 + rr(22, b.y1 - b.y0 - 22); }
  }

  // ---- HUD: wheat counter + Build menu ----
  const wheatPill = document.getElementById('wheatpill'), wheatNum = document.getElementById('wheatnum');
  let uiKey = '';
  function refreshWheatHud() {
    const key = farms.length + '|' + wheatCount; if (key === uiKey) return; uiKey = key;
    wheatPill.style.display = (farms.length || wheatCount) ? 'flex' : 'none'; wheatNum.textContent = wheatCount;
  }
  function focusFarm(f) { if (!f) return; const ctr = farmCenter(f); cpx = ctr[0]; cpy = ctr[1]; clampCam(); }
  function renderBuild() {
    const btn = document.getElementById('farmBuy'), info = document.getElementById('farmInfo');
    info.textContent = 'Ready in ' + GROW_SEC + 's \u00B7 ' + WHEAT_PER_HARVEST + ' wheat each time';
    if (placing) { btn.textContent = 'Placing\u2026'; btn.disabled = true; }
    else if (gold < FARM_COST) { btn.textContent = 'Need ' + FARM_COST + ' gold'; btn.disabled = true; }
    else { btn.textContent = 'Build \u00B7 ' + FARM_COST + ' gold'; btn.disabled = false; }
  }
  function startPlacing() {
    if (placing || movingFarm) return;
    if (gold < FARM_COST) { toast('You need ' + FARM_COST + ' gold'); return; }
    const spot = findFarmSpot(0);
    placing = { c: spot.c, r: spot.r, rot: spot.rot };
    sel = null; hov = null; drag = null; tap = null; barKey = '#';
    buildPanel.style.display = 'none'; buildBtn.classList.remove('open');
    rebuildFarm(placing); focusFarm(placing);
    toast('Drag or tap to place your farm, then tap \u2713');
  }
  function placeTo(sx, sy) {
    if (!placing) return;
    const s = slotAt(sx, sy); if (!s) return;
    const cols = fCols(placing.rot), rows = fRows(placing.rot);
    placing.c = clampI(s.c - Math.floor(cols / 2), 0, WORLD_W / CELL - cols);
    placing.r = clampI(s.r - Math.floor(rows / 2), 0, WORLD_H / CELL - rows);
    barKey = '#'; rebuildFarm(placing);
  }
  function activeFarmMove() { return placing || movingFarm; }
  function rotateFarm() {
    const fm = activeFarmMove(); if (!fm) return;
    const oldC = fCols(fm.rot), oldR = fRows(fm.rot);
    const cx = fm.c + oldC / 2, cy = fm.r + oldR / 2;
    fm.rot ^= 1;
    const cols = fCols(fm.rot), rows = fRows(fm.rot);
    fm.c = clampI(Math.round(cx - cols / 2), 0, WORLD_W / CELL - cols);
    fm.r = clampI(Math.round(cy - rows / 2), 0, WORLD_H / CELL - rows);
    if (movingFarm) { movingFarm.farm.c = fm.c; movingFarm.farm.r = fm.r; movingFarm.farm.rot = fm.rot; movingFarm.ok = farmSpotOK(fm.c, fm.r, fm.rot); rebuildFarm(movingFarm.farm); }
    else rebuildFarm(fm);
    barKey = '#';
  }
  function setMovingFarmPos(c, r) {
    const m = movingFarm; if (!m) return;
    const cols = fCols(m.rot), rows = fRows(m.rot);
    m.c = clampI(c, 0, WORLD_W / CELL - cols); m.r = clampI(r, 0, WORLD_H / CELL - rows);
    m.farm.c = m.c; m.farm.r = m.r; m.farm.rot = m.rot;
    m.ok = farmSpotOK(m.c, m.r, m.rot);
  }
  function moveFarmTo(sx, sy) {
    if (!movingFarm) return;
    const s = slotAt(sx, sy); if (!s) return;
    setMovingFarmPos(s.c - Math.floor(fCols(movingFarm.rot) / 2), s.r - Math.floor(fRows(movingFarm.rot) / 2));
    barKey = '#'; rebuildFarm(movingFarm.farm);
  }
  function startMovingFarm(f, sx, sy) {
    if (!f || placing || movingFarm || drag) return;
    const s = slotAt(sx, sy) || { c: f.c, r: f.r };
    eachFarmSlot(f, (c, r) => { const o = occ.get(slot(c, r)); if (o && o.type === 'farm') occ.delete(slot(c, r)); });
    movingFarm = { farm: f, c: f.c, r: f.r, rot: f.rot, oc: f.c, or: f.r, orot: f.rot, offC: s.c - f.c, offR: s.r - f.r, ok: true, held: true, id: null, q: { x: sx, y: sy } };
    sel = null; hov = null; barKey = '#';
    rebuildFarm(f);
  }
  function endMovingFarm(commit) {
    if (!movingFarm) return;
    const m = movingFarm, f = m.farm;
    if (commit) {
      if (!farmSpotOK(m.c, m.r, m.rot)) { mvBar.classList.remove('shake'); void mvBar.offsetWidth; mvBar.classList.add('shake'); return; }
      f.c = m.c; f.r = m.r; f.rot = m.rot;
    } else {
      f.c = m.oc; f.r = m.or; f.rot = m.orot;
    }
    claimFarmSlots(f); rebuildFarm(f); saveFarms();
    movingFarm = null; barKey = '#';
  }
  function endPlacing(commit) {
    if (!placing) return;
    const p = placing;
    if (commit) {
      if (!farmSpotOK(p.c, p.r, p.rot)) { mvBar.classList.remove('shake'); void mvBar.offsetWidth; mvBar.classList.add('shake'); return; }
      if (!spendGold(FARM_COST)) return;
      const f = { t0: Date.now(), c: p.c, r: p.r, rot: p.rot };
      destroyFarmVisual(p);
      placing = null; barKey = '#';
      farms.push(f); claimFarmSlots(f); saveFarms(); rebuildFarm(f);
      refreshWheatHud(); setStat('wheat', ICON.wheat, 'Wheat', wheatCount); renderBuild(); focusFarm(f);
      toast('Farm built! Your villagers are heading out to plant');
    } else {
      destroyFarmVisual(p);
      placing = null; barKey = '#'; renderBuild();
    }
  }
  buildBtn.addEventListener('click', renderBuild);
  document.getElementById('farmBuy').addEventListener('click', () => { if (!placing && !movingFarm) startPlacing(); });
  if (farms.length || wheatCount) setStat('wheat', ICON.wheat, 'Wheat', wheatCount);

  // ---- on the map: green progress bar with the time (Clash-style), then a wheat bubble to tap ----
  const farmUIL = world.addChild(new PX.Container());
  const floaters = [];
  const lerp = (a, b, t) => a + (b - a) * t;
  const wheatTexBig = PX.Texture.from('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON.wheat.replace('width="64" height="64"', 'width="192" height="192"')));
  function ensureFarmUI(f) {
    if (f.ui) return f.ui;
    const barBox = farmUIL.addChild(new PX.Container()), barG = barBox.addChild(new PX.Graphics());
    const barT = barBox.addChild(new PX.Text('', { fontFamily: 'system-ui, sans-serif', fontWeight: '800', fontSize: 26, fill: 0xffffff, stroke: 0x1e0f05, strokeThickness: 7, lineJoin: 'round' }));
    barT.anchor.set(.5); barT.scale.set(.5); barT.resolution = 2;
    const bubble = farmUIL.addChild(new PX.Container()), bubG = bubble.addChild(new PX.Graphics());
    bubG.lineStyle({ width: 2.5, color: 0x6b4519, join: 'round' }); bubG.beginFill(0xfffae1, .97); bubG.drawCircle(0, 0, 25); bubG.endFill();
    bubG.beginFill(0xfffae1, .97); bubG.drawPolygon([-7, 23, 0, 34, 7, 23]); bubG.endFill();
    const wheatBig = bubble.addChild(new PX.Sprite(wheatTexBig));
    wheatBig.anchor.set(.5); wheatBig.scale.set(40 / 192); wheatBig.position.set(0, -1);
    barBox.visible = bubble.visible = false;
    return (f.ui = { barBox, barG, barT, bubble, barSec: -1 });
  }
  function destroyFarmUI(f) {
    if (!f || !f.ui) return;
    for (const c of [f.ui.barBox, f.ui.bubble]) if (c) { c.removeFromParent(); c.destroy({ children: true }); }
    f.ui = null;
  }
  function updateFarmUI(time) {
    refreshWheatHud();
    const canShow = !placing;
    const movingF = movingFarm ? movingFarm.farm : null;
    for (const f of farms) {
      const ui = ensureFarmUI(f);
      const st = farmState(f), p = farmProgress(f);
      const hf = .22 + .78 * Math.min(1, p / .85), m = Math.max(0, Math.min(1, (p - .35) / .5));   // young wheat is short and green, it turns golden as it ripens
      f.hf = hf;
      f.tint = (Math.round(lerp(.6, 1, m) * 255) << 16) | (Math.round(lerp(.93, 1, m) * 255) << 8) | Math.round(lerp(.36, 1, m) * 255);
      const show = canShow && farmVisible(f) && f !== movingF;
      ui.barBox.visible = show && st === 'growing'; ui.bubble.visible = show && st === 'ready';
      const [fx, fy] = farmCenter(f);
      if (ui.barBox.visible) {
        const bw = 118, bh = 20, bx = fx - bw / 2, bt = fy - 72, left = Math.max(0, Math.ceil(GROW_SEC * (1 - p)));
        ui.barG.clear();
        ui.barG.beginFill(0x000000, .25); ui.barG.drawRoundedRect(bx - 2, bt + 1, bw + 4, bh + 6, 10); ui.barG.endFill();
        ui.barG.lineStyle({ width: 2, color: 0xc99a4b }); ui.barG.beginFill(0x2a1a0c); ui.barG.drawRoundedRect(bx - 3, bt - 3, bw + 6, bh + 6, 10); ui.barG.endFill(); ui.barG.lineStyle(0);
        ui.barG.beginFill(0x4a321a); ui.barG.drawRoundedRect(bx, bt, bw, bh, 7); ui.barG.endFill();
        if (p > 0) {
          const w = Math.max(10, bw * p), r = Math.min(7, w / 2);
          ui.barG.beginFill(0x3aaa30); ui.barG.drawRoundedRect(bx, bt, w, bh, r); ui.barG.endFill();
          ui.barG.beginFill(0x6fe052); ui.barG.drawRoundedRect(bx, bt, w, bh * .62, r); ui.barG.endFill();
          ui.barG.beginFill(0xc2fa8c, .55); ui.barG.drawRoundedRect(bx + 2, bt + 2, Math.max(4, w - 4), 4, 2); ui.barG.endFill();
        }
        if (left !== ui.barSec) { ui.barSec = left; ui.barT.text = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); }
        ui.barT.position.set(fx, bt + bh / 2 + .5);
      }
      if (ui.bubble.visible) ui.bubble.position.set(fx, fy - 80 + Math.sin(time * 3) * 4);
    }
    const now = performance.now();
    for (let i = floaters.length - 1; i >= 0; i--) {                       // "+10 wheat" floating up
      const f = floaters[i], a = (now - f.t0) / 1500;
      if (a >= 1) { farmUIL.removeChild(f.txt); f.txt.destroy(); floaters.splice(i, 1); continue; }
      f.txt.alpha = 1 - a; f.txt.position.set(f.x, f.y - 30 - a * 60);
    }
  }
  function collectFarm(f) {
    if (farmState(f) !== 'ready') return;
    wheatCount += WHEAT_PER_HARVEST; f.t0 = Date.now(); if (f.ui) f.ui.barSec = -1; saveFarms();      // harvest, then the field is replanted
    setStat('wheat', ICON.wheat, 'Wheat', wheatCount); refreshWheatHud();
    const [fx, fy] = farmCenter(f);
    const t = new PX.Text('+' + WHEAT_PER_HARVEST + ' wheat', { fontFamily: 'system-ui, sans-serif', fontWeight: '800', fontSize: 36, fill: 0xfff3b0, stroke: 0x3c2305, strokeThickness: 8, lineJoin: 'round' });
    t.anchor.set(.5); t.scale.set(.5); t.resolution = 2; farmUIL.addChild(t); floaters.push({ t0: performance.now(), txt: t, x: fx, y: fy });
    toast('Collected ' + WHEAT_PER_HARVEST + ' wheat');
  }
  function tapFarm(sx, sy) {                                                  // tap a ripe farm (or its bubble) to collect
    if (placing || movingFarm) return false;
    for (const f of farms) {
      if (farmState(f) !== 'ready') continue;
      const [fx, fy] = farmCenter(f);
      const bx = (fx - cpx) * zoom + cw / 2, by = (fy - 80 - cpy) * zoom + ch / 2;
      if (Math.hypot(sx - bx, sy - by) < 46 * zoom) { collectFarm(f); return true; }
      const s = slotAt(sx, sy), b = farmBounds(f);
      if (s) { const c0 = Math.floor(b.x0 / CELL), r0 = Math.floor(b.y0 / CELL), c1 = Math.ceil(b.x1 / CELL), r1 = Math.ceil(b.y1 / CELL); if (s.c >= c0 && s.c < c1 && s.r >= r0 && s.r < r1) { collectFarm(f); return true; } }
    }
    return false;
  }

  let lastMs = 0, slowEma = 16, slowN = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    const time = ms / 1000, now = performance.now(); fc++;
    // auto quality: if the phone can't keep up, draw with fewer pixels (down to 1x) so it stays smooth
    if (lastMs) { const d = ms - lastMs; if (d < 250) slowEma += (d - slowEma) * .1; }
    lastMs = ms;
    if (slowEma > 24 && dpr > 1) { if (++slowN > 90) { slowN = 0; slowEma = 16; resCap = Math.max(1, dpr - .25); resize(); } } else slowN = 0;
    try {
      world.scale.set(zoom); world.position.set(cw / 2 - cpx * zoom, ch / 2 - cpy * zoom);     // the camera
      cullGround();
      updateSelection(time, now);
      updateMoveGrid(time);
      updateTrees(time, now);
      updateFarmUI(time);
      updateFarm(time);
      updateHome(time);
      updateOverlay(time);
      app.renderer.render(app.stage);
    } catch (e) { if (!frame.err) { frame.err = 1; console.error('frame error', e); } }
  }

  let loaded = 0;
  const ready = () => {
    if (++loaded < BLK.length + TRE.length || started) return; started = true;
    const mm = PX.MIPMAP_MODES ? { mipmap: PX.MIPMAP_MODES.ON } : undefined;      // smooth when zoomed out
    [...BLK, ...TRE].forEach(a => { a.tex = PX.Texture.from(a.im, mm); });
    shadowTex = radialTex('20,70,6', .42, 64); glowTex = radialTex('255,225,120', .9, 64);
    growForest();
    buildGround(); buildTrees(); farms.forEach(rebuildFarm);
    syncVillagers();
    resize();
    // whole clearing diamond fits on screen
    const dw = (HALF_W * 2 + HALF_H * 2) * IX + 160, dh = (HALF_W * 2 + HALF_H * 2) * IY + 200;
    zoom = Math.min(cw / dw, ch / dh);
    cpx = projX(spawn.x, spawn.y); cpy = projY(spawn.x, spawn.y); clampCam();
    requestAnimationFrame(frame);
    window.game = { setStat, setPopulation, villagers, occ, slot, cam: () => ({ cpx, cpy, zoom }), spawn, clearing, trees, farms, gold: () => gold, setGold, placing: () => placing, WORLD_W, WORLD_H, CELL, projX, projY, unprojX, unprojY };   // hooks for the next step
  };
  [...BLK, ...TRE].forEach(a => a.im.onload = ready);
  const missing = name => () => { hint.textContent = name + ' not found. Put it in the same folder as index.html'; hint.style.opacity = 1; };
})();
</script>
</body>
</html>
