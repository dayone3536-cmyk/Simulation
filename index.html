<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Forest Village</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #143310; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 66%, rgba(10,50,0,.28) 100%); }
  #info { display: none; position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 12px 10px 16px; border-radius: 16px;
    background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b; box-shadow: 0 6px 18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,180,.35);
    color: #fff3d6; font: 600 14px system-ui, sans-serif; white-space: nowrap; align-items: center; gap: 14px; animation: pop .18s ease-out; }
  #info small { display: block; font-weight: 500; font-size: 11px; opacity: .7; margin-top: 2px; }
  #info button { border: 0; border-radius: 10px; padding: 9px 14px; font: 700 13px system-ui, sans-serif; color: #2a1a05; background: linear-gradient(#ffe27a, #f0a92b); box-shadow: 0 2px 0 #9a6410; }
  #info button:active { transform: translateY(2px); box-shadow: none; }
  #info button.x { background: none; box-shadow: none; color: #fff3d6; padding: 6px 8px; font-size: 18px; opacity: .7; }
  @keyframes pop { from { transform: translateX(-50%) translateY(14px) scale(.94); opacity: 0; } }
  #hint { position: fixed; left: 14px; bottom: 12px; font: 13px system-ui, sans-serif; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; transition: opacity .6s; }
  /* Phone held upright (or rotation locked): the whole game turns 90 degrees, so it always plays sideways */
  canvas.rot { position: fixed; left: 0; top: 0; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
  canvas.rot.flip { transform: rotate(-90deg) translateX(-100%); }
  #flip { display: none; position: fixed; left: 12px; top: 12px; z-index: 5; padding: 8px 12px; border: 0; border-radius: 10px;
    background: rgba(0,0,0,.45); color: #fff; font: 600 13px system-ui, sans-serif; }
  /* HUD: gold bar (top right) and Build button (bottom right). Turns with the game when the phone is upright. */
  #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  #hud.rot { transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
  #hud.rot.flip { transform: rotate(-90deg) translateX(-100%); }
  #goldbar { position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px;
    min-width: 120px; padding: 4px 14px 4px 4px; border-radius: 999px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b;
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,235,180,.35); color: #ffe27a; font: 800 17px system-ui, sans-serif; }
  #goldbar .coin { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #9a6410; box-sizing: border-box;
    background: radial-gradient(circle at 35% 30%, #fff4b0, #f0a92b 60%, #b9791a); }
  #goldnum { flex: 1; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #buildbtn { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); pointer-events: auto;
    width: 84px; height: 84px; border: 3px solid #7a4a08; border-radius: 22px; background: linear-gradient(#ffe27a, #f0a92b); box-shadow: 0 5px 0 #9a6410, 0 8px 16px rgba(0,0,0,.5);
    color: #2a1a05; font: 800 15px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; -webkit-tap-highlight-color: transparent; }
  #buildbtn svg { width: 42px; height: 42px; }
  #buildbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9a6410; }
  #buildpanel { display: none; position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(112px + env(safe-area-inset-bottom)); pointer-events: auto;
    padding: 14px 16px; border-radius: 16px; background: linear-gradient(#3b2a18, #261a0e); border: 2px solid #c99a4b; box-shadow: 0 6px 18px rgba(0,0,0,.55);
    color: #fff3d6; font: 600 14px system-ui, sans-serif; animation: pop2 .18s ease-out; }
  #buildpanel small { display: block; font-weight: 500; font-size: 11px; opacity: .7; margin-top: 2px; }
  @keyframes pop2 { from { transform: translateY(14px) scale(.94); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="info"></div>
<button id="flip">Flip screen</button>
<div id="hud">
  <div id="goldbar"><div class="coin"></div><div id="goldnum">...</div></div>
  <div id="buildpanel"><div>Build<small>Buildings are coming soon</small></div></div>

</div>
<div id="hint">Drag to look around, pinch to zoom, tap a slot to select it</div>

<script>
(() => {
  // ---- tune these ----
  const HALF_W = 640;           // half the width of the clearing (world units, clearing is 1280 wide)
  const HALF_H = 400;           // half the height of the clearing (800 tall)
  const BAND = 1200;            // how deep the forest is around the clearing
  const VOID = '#143310';        // what lies past the edge of the map
  // --------------------
  const CELL = 80;              // one checker square = one future build tile
  const WORLD_W = 2 * (HALF_W + BAND), WORLD_H = 2 * (HALF_H + BAND);

  // Clash-style view: the flat world is rotated 45 degrees and squashed 2:1, so every
  // square becomes a diamond. World coordinates stay plain (x, y); only drawing changes.
  const IX = Math.SQRT1_2, IY = Math.SQRT1_2 / 2;
  const projX = (x, y) => (x - y) * IX;
  const projY = (x, y) => (x + y) * IY;
  const unprojX = (u, v) => (u / IX + v / IY) / 2;
  const unprojY = (u, v) => (v / IY - u / IX) / 2;

  // Phones: a tap asks Chrome for fullscreen + landscape lock (touch only counts as a "real" tap on release).
  // If the lock is refused, or auto-rotate is off, the game rotates itself instead, see resize().
  const coarse = matchMedia('(pointer: coarse)').matches;
  let locked = false, tries = 0, forced = false, flipped = false;
  function goLandscape() {
    if (!coarse || locked || tries++ > 4) return;
    const el = document.documentElement;
    Promise.resolve(el.requestFullscreen && el.requestFullscreen({ navigationUI: 'hide' }))
      .then(() => screen.orientation.lock('landscape'))
      .then(() => { locked = true; })
      .catch(() => {});
  }
  window.addEventListener('pointerup', goLandscape);
  window.addEventListener('orientationchange', () => setTimeout(() => window.dispatchEvent(new Event('resize')), 250));

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  // ---------- HUD + gold (saved in Supabase) ----------
  const SUPABASE_URL = 'https://illuyxprrvgdxdpnwcqc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nYxpvEA0gp5udUktTXcwYw_stN5h7gA';   // publishable key only. NEVER put the secret key in this file.
  const hud = document.getElementById('hud'), goldEl = document.getElementById('goldnum');
  const buildBtn = document.getElementById('buildbtn'), buildPanel = document.getElementById('buildpanel');
  buildBtn.addEventListener('click', () => { const o = buildPanel.style.display !== 'block'; buildPanel.style.display = o ? 'block' : 'none'; buildBtn.classList.toggle('open', o); buildBtn.classList.remove('hint'); });
  let gold = 0, sb = null;
  const setGold = n => { gold = n; goldEl.textContent = Number(n).toLocaleString(); };
  async function initGold() {
    const ok = window.supabase && !SUPABASE_URL.startsWith('PASTE') && !SUPABASE_KEY.startsWith('PASTE');
    if (!ok) { setGold(50); return; }                          // not connected yet: just show the starting 50
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }   // same browser = same player
      const { data, error } = await sb.rpc('get_player');      // creates the player with 50 gold the first time
      if (error) throw error;
      setGold(data);
    } catch (e) { console.error('Gold load failed', e); goldEl.textContent = '?'; }
  }
  initGold();

  // ---------- seeded random ----------
  let seed = (Math.random() * 2 ** 32) >>> 0;
  function rng() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  const rr = (a, b) => a + rng() * (b - a);

        if (rng() < EMPTY_CHANCE) continue;
        const x = (c + .5) * CELL, y = (r + .5) * CELL;
        if (inClearing(x, y, R[0][2] * .7, R[0][3], 0)) continue;     // keep the clearing open
        const t = { type: 'tree', x, y, c, r, v: (rng() * TRE.length) | 0, s: rr(.85, 1.1), flip: rng() < .5 ? -1 : 1, ph: rr(0, 6.28) };
        trees.push(t); occ.set(slot(c, r), t);
      }
    }
    trees.sort((a, b) => (a.x + a.y) - (b.x + b.y) || a.x - b.x);   // far to near in the diamond view
  }

  // ---------- selection: tap a slot to highlight it ----------
  let sel = null, hov = null, selT = 0;            // sel/hov = { c, r } or null
  const infoEl = document.getElementById('info');
  function slotAt(sx, sy) {
    const u = cpx + (sx - cw / 2) / zoom, v = cpy + (sy - ch / 2) / zoom;
    const c = Math.floor(unprojX(u, v) / CELL), r = Math.floor(unprojY(u, v) / CELL);
    return (c < 0 || r < 0 || c >= WORLD_W / CELL || r >= WORLD_H / CELL) ? null : { c, r };
  }
  function card() {
    if (!sel) { infoEl.style.display = 'none'; return; }
    const t = occ.get(slot(sel.c, sel.r));
    infoEl.innerHTML = '<div>' + (t ? 'Oak tree' : 'Empty land') + '<small>' + (t ? 'Clear it to make room' : 'Ready to build') + ' \u00b7 slot ' + sel.c + ', ' + sel.r + '</small></div>' +
      (t ? '<button data-a="clear">Clear</button>' : '<button data-a="build">Build</button>') + '<button class="x" data-a="close">\u2715</button>';
    infoEl.style.display = 'flex';
  }
  function select(sx, sy) { sel = slotAt(sx, sy); selT = performance.now(); card(); }
  infoEl.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'close') sel = null;
    if (a === 'clear') { const t = occ.get(slot(sel.c, sel.r)); if (t) { t.dying = performance.now(); occ.delete(slot(sel.c, sel.r)); setTimeout(() => { const i = trees.indexOf(t); if (i >= 0) trees.splice(i, 1); }, 400); selT = performance.now(); } }
    card();
  });
  // a diamond around slot centre, k = 1 is the exact tile, k > 1 grows outward (used for the tap ripple)
  function ringPath(c, r, k) {
    const cx = (c + .5) * CELL, cy = (r + .5) * CELL, h = CELL / 2 * k;
    ctx.beginPath();
    [[-h, -h], [h, -h], [h, h], [-h, h]].forEach(([dx, dy], i) => ctx[i ? 'lineTo' : 'moveTo'](projX(cx + dx, cy + dy), projY(cx + dx, cy + dy)));
    ctx.closePath();
  }
  function tilePath(c, r) {
    ctx.beginPath();
    ctx.moveTo(projX(c * CELL, r * CELL), projY(c * CELL, r * CELL));
    ctx.lineTo(projX((c + 1) * CELL, r * CELL), projY((c + 1) * CELL, r * CELL));
    ctx.lineTo(projX((c + 1) * CELL, (r + 1) * CELL), projY((c + 1) * CELL, (r + 1) * CELL));
    ctx.lineTo(projX(c * CELL, (r + 1) * CELL), projY(c * CELL, (r + 1) * CELL));
    ctx.closePath();
  }
  function mapTransform() { ctx.setTransform(zoom * dpr, 0, 0, zoom * dpr, (cw / 2 - cpx * zoom) * dpr, (ch / 2 - cpy * zoom) * dpr); }

  // ---------- camera (cpx, cpy = view centre in projected space) ----------
  let dpr = 1, cw = 0, ch = 0, zoom = 1, cpx = 0, cpy = 0;
  const MIN_ZOOM = .2, MAX_ZOOM = 1.6;
  function clampCam() {
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
    let wx = unprojX(cpx, cpy), wy = unprojY(cpx, cpy);
    wx = Math.max(CELL * 2, Math.min(WORLD_W - CELL * 2, wx));      // the camera may roam the whole map
    wy = Math.max(CELL * 2, Math.min(WORLD_H - CELL * 2, wy));
    cpx = projX(wx, wy); cpy = projY(wx, wy);
  }
  const flipBtn = document.getElementById('flip');
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    forced = coarse && window.innerHeight > window.innerWidth;      // upright phone: turn the game sideways
    canvas.classList.toggle('rot', forced); canvas.classList.toggle('flip', forced && flipped);
    flipBtn.style.display = forced ? 'block' : 'none';
    hud.classList.toggle('rot', forced); hud.classList.toggle('flip', forced && flipped);
    hud.style.width = forced ? window.innerHeight + 'px' : ''; hud.style.height = forced ? window.innerWidth + 'px' : '';
    if (forced) { cw = window.innerHeight; ch = window.innerWidth; canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; }
    else { cw = window.innerWidth; ch = window.innerHeight; canvas.style.width = ''; canvas.style.height = ''; }
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    clampCam();
  }
  flipBtn.addEventListener('click', () => { flipped = !flipped; resize(); });
  // screen touch point -> point on the (possibly rotated) canvas
  function pt(e) {
    if (!forced) return { x: e.clientX, y: e.clientY };
    return flipped ? { x: cw - e.clientY, y: e.clientX } : { x: e.clientY, y: ch - e.clientX };
  }
  window.addEventListener('resize', resize);

  // pointer: drag + pinch (screen movement is already in projected space)
  const ptrs = new Map(); let pinchD = 0, tap = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, pt(e));
    canvas.classList.add('drag'); hint.style.opacity = 0;
    const p0 = ptrs.get(e.pointerId);
    tap = ptrs.size === 1 ? { x: p0.x, y: p0.y, t: performance.now(), ok: true } : null;   // a tap = short press, barely moved
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' && !ptrs.size) hov = slotAt(pt(e).x, pt(e).y);
    const p = ptrs.get(e.pointerId); if (!p) return;
    const q = pt(e);
    if (tap && (ptrs.size > 1 || Math.hypot(q.x - tap.x, q.y - tap.y) > 9)) tap.ok = false;
    if (ptrs.size === 1) { cpx -= (q.x - p.x) / zoom; cpy -= (q.y - p.y) / zoom; }
    p.x = q.x; p.y = q.y;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, zoom * dist / pinchD); pinchD = dist;
    }
    clampCam();
  });
  const up = e => {
    const wasTap = e.type === 'pointerup' && tap && tap.ok && ptrs.size === 1 && performance.now() - tap.t < 500;
    const at = wasTap ? pt(e) : null;
    ptrs.delete(e.pointerId); if (!ptrs.size) { canvas.classList.remove('drag'); tap = null; }
    if (at) select(at.x, at.y);
  };
  canvas.addEventListener('pointerleave', () => { hov = null; }); canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  function zoomAt(sx, sy, z) {
    const u = cpx + (sx - cw / 2) / zoom, v = cpy + (sy - ch / 2) / zoom;   // projected point under the cursor
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
    cpx = u - (sx - cw / 2) / zoom; cpy = v - (sy - ch / 2) / zoom;
  }
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); hint.style.opacity = 0;
    const q = pt(e); zoomAt(q.x, q.y, zoom * Math.exp(-e.deltaY * .0012)); clampCam();
  }, { passive: false });

  // ---------- render ----------
  let started = false;

  // Every square is a real tile sprite from your grass pack. Dark and light tiles alternate
  // across the whole map, forest included. Sprites are pixel art, so smoothing stays off.
  function drawGround() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = VOID; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // which world squares are on screen: unproject the four screen corners
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const [sx, sy] of [[0, 0], [cw, 0], [0, ch], [cw, ch]]) {
      const u = cpx + (sx - cw / 2) / zoom, v = cpy + (sy - ch / 2) / zoom;
      const wx = unprojX(u, v), wy = unprojY(u, v);
      minX = Math.min(minX, wx); maxX = Math.max(maxX, wx);
      minY = Math.min(minY, wy); maxY = Math.max(maxY, wy);
    }
    const Wd = 2 * CELL * IX, Hd = 2 * CELL * IY;
    const hx = cw / 2 / zoom + Wd, hy = ch / 2 / zoom + Hd;     // half the view in projected units, plus a tile
    ctx.imageSmoothingEnabled = true;
    ctx.setTransform(zoom * dpr, 0, 0, zoom * dpr, (cw / 2 - cpx * zoom) * dpr, (ch / 2 - cpy * zoom) * dpr);
    // tiles exist only inside the map
    const c0 = Math.max(0, Math.floor(minX / CELL) - 1), c1 = Math.min(WORLD_W / CELL, Math.ceil(maxX / CELL) + 1);
    const r0 = Math.max(0, Math.floor(minY / CELL) - 1), r1 = Math.min(WORLD_H / CELL, Math.ceil(maxY / CELL) + 1);
    for (let r = r0; r < r1; r++) {
      for (let c = c0; c < c1; c++) {
        const x = projX(c * CELL, (r + 1) * CELL), y = projY(c * CELL, r * CELL);
        if (x < cpx - hx || x > cpx + hx || y < cpy - hy || y > cpy + hy) continue;
        const b = BLK[(c * 7 + r * 13 + (c * r)) % BLK.length], bw = Wd + 2, bh = bw * b.h / b.w; ctx.drawImage(b.im, x - 1, y - .5, bw, bh);
      }
    }
      }

  function frame(ms) {
    const time = ms / 1000;
    drawGround();
    const now = performance.now();
    if (hov && !(sel && hov.c === sel.c && hov.r === sel.r)) {       // desktop hover preview
      mapTransform(); ringPath(hov.c, hov.r, 1); ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
      ctx.lineWidth = 1.6 / zoom; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke();
    }
    let rgb = '120,255,140';
    if (sel) {
      rgb = occ.get(slot(sel.c, sel.r)) ? '255,200,70' : '120,255,140';   // amber = occupied, green = free to build
      mapTransform(); ringPath(sel.c, sel.r, 1);
      ctx.fillStyle = 'rgba(' + rgb + ',' + (.30 + .12 * Math.sin(time * 5)).toFixed(3) + ')'; ctx.fill();
      const rp = (now - selT) / 650;                      // ripple: two rings that spread out and fade
      for (let i = 0; i < 2; i++) { const q = rp - i * .22; if (q > 0 && q < 1) { ringPath(sel.c, sel.r, 1 + q * 1.4); ctx.lineWidth = (3 - q * 2) / zoom; ctx.strokeStyle = 'rgba(' + rgb + ',' + (.9 * (1 - q)).toFixed(2) + ')'; ctx.stroke(); } }
    }

    // project every tree to the screen once, keep the visible ones (already sorted far to near)
    const vis = [];
    for (const t of trees) {
      const sx = (projX(t.x, t.y) - cpx) * zoom + cw / 2, sy = (projY(t.x, t.y) - cpy) * zoom + ch / 2;
      if (sx < -120 * zoom || sx > cw + 120 * zoom || sy < -40 * zoom || sy > ch + 160 * zoom) continue;
      vis.push([t, sx, sy]);
    }

    // shadows first, so every canopy sits above every shadow
    for (const [t, sx, sy] of vis) {
      const w = TRE[t.v].w * t.s * .75 * (t.dying ? Math.max(0, 1 - (now - t.dying) / 400) : 1);
      ctx.setTransform(zoom * dpr, 0, 0, zoom * dpr * .42, sx * dpr, (sy - 2 * zoom) * dpr);
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, w * .5);
      g.addColorStop(0, 'rgba(20,70,6,.42)'); g.addColorStop(1, 'rgba(20,70,6,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, w * .5, 0, 7); ctx.fill();
    }

    // trees stay upright, drawn at their projected base, with a slight wind sway.
    // The tree on the selected slot bounces and glows; a cleared tree shrinks away.
    for (const [t, sx, sy] of vis) {
      const tr = TRE[t.v], isSel = sel && t.c === sel.c && t.r === sel.r;
      let k = 1, sq = 1;
      if (t.dying) { const d = Math.min(1, (now - t.dying) / 400); k = 1 - d; ctx.globalAlpha = k; }
      else if (isSel) { const q = (now - selT) / 1000; sq = 1 + .07 * Math.exp(-q * 4) * Math.sin(q * 22); }
      const w = tr.w * t.s * .9 * k, h = tr.h * t.s * .9 * k * sq;
      const sway = Math.sin(time * 1.1 + t.ph) * .02;
      ctx.setTransform(t.flip * zoom * dpr, 0, sway * zoom * dpr, zoom * dpr, sx * dpr, sy * dpr);
      if (isSel && !t.dying) { ctx.shadowColor = 'rgba(255,225,120,.95)'; ctx.shadowBlur = (10 + 5 * Math.sin(time * 5)) * zoom * dpr; }
      ctx.drawImage(tr.im, -w / 2, -h + 4 * t.s, w, h);
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1;
    }
    if (sel) {                                           // outline + corner arrows on top, so a tree can never hide them
      mapTransform(); ringPath(sel.c, sel.r, 1);
      ctx.lineJoin = 'round'; ctx.lineWidth = 5 / zoom; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
      ctx.shadowColor = 'rgba(' + rgb + ',1)'; ctx.shadowBlur = 14 * zoom * dpr;
      ctx.lineWidth = 2.6 / zoom; ctx.strokeStyle = '#fff'; ctx.setLineDash([9 / zoom, 5 / zoom]); ctx.lineDashOffset = -time * 14 / zoom; ctx.stroke();
      ctx.setLineDash([]); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      const bob = (Math.sin(time * 4) * .5 + .5) * .16 + .06;          // arrows pulse outward from each corner
      const cx = (sel.c + .5) * CELL, cy = (sel.r + .5) * CELL, h = CELL / 2;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5 / zoom;
      for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const ox = cx + dx * h * (1 + bob), oy = cy + dy * h * (1 + bob);
        const px = projX(ox, oy), py = projY(ox, oy), ax = projX(dx, dy), ay = projY(dx, dy), L = Math.hypot(ax, ay), nx = ax / L, ny = ay / L, s = 9 / zoom * Math.max(.8, zoom * 1.2);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - nx * s * 1.4 - ny * s * .8, py - ny * s * 1.4 + nx * s * .8); ctx.lineTo(px - nx * s * 1.4 + ny * s * .8, py - ny * s * 1.4 - nx * s * .8); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }

  let loaded = 0;
  const ready = () => {
    if (++loaded < BLK.length + TRE.length || started) return; started = true;
    growForest();
    resize();
    // whole clearing diamond fits on screen
    const dw = (HALF_W * 2 + HALF_H * 2) * IX + 160, dh = (HALF_W * 2 + HALF_H * 2) * IY + 200;
    zoom = Math.min(cw / dw, ch / dh);
    cpx = projX(spawn.x, spawn.y); cpy = projY(spawn.x, spawn.y); clampCam();
    requestAnimationFrame(frame);
    window.game = { occ, slot, cam: () => ({ cpx, cpy, zoom }), spawn, clearing, trees, WORLD_W, WORLD_H, CELL, projX, projY, unprojX, unprojY };   // hooks for the next step
  };
  [...BLK, ...TRE].forEach(a => a.im.onload = ready);
  const missing = name => () => { hint.textContent = name + ' not found. Put it in the same folder as index.html'; hint.style.opacity = 1; };
})();
</script>
</body>
</html>
