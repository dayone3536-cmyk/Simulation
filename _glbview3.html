<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#7fb85e;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}figure{margin:0;background:#6ea84f;padding:6px}figcaption{color:#fff;font:14px sans-serif}</style></head>
<body>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import { GLTFLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const IX = Math.SQRT1_2, IY = IX / 2;
const projX = (x, y) => (x - y) * IX;
const projY = (x, y) => (x + y) * IY;
const ELEV = 30 * Math.PI / 180;
const CAM_DIR = new THREE.Vector3(Math.cos(ELEV) * Math.cos(Math.PI / 4), Math.sin(ELEV), Math.cos(ELEV) * Math.sin(Math.PI / 4));
const CAM_UP = new THREE.Vector3(-Math.sin(ELEV) * Math.SQRT1_2, Math.cos(ELEV), -Math.sin(ELEV) * Math.SQRT1_2);
const FW = 5 * 64, FH = 2 * 64;

function isGreenGround(mesh) { const c = mesh.material && mesh.material.color; return !!c && c.r < .15 && c.g > .5 && c.b < .15; }
function isBlue(mesh) { const c = mesh.material && mesh.material.color; return !!c && c.r < .2 && c.g < .2 && c.b > .6; }
function isGroundPlane(mesh) { return /Plane/.test(mesh.name) || /Plane/.test(mesh.parent && mesh.parent.name || ''); }

function groupMeshes(root, skip) {
  const meshes = [];
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isMesh && !skip(o)) { const p = new THREE.Vector3(); o.getWorldPosition(p); meshes.push({ o, p }); } });
  const parent = meshes.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const join = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
  for (let i = 0; i < meshes.length; i++) for (let j = i + 1; j < meshes.length; j++)
    if (Math.hypot(meshes[i].p.x - meshes[j].p.x, meshes[i].p.z - meshes[j].p.z) < 25) join(i, j);
  const groups = new Map();
  meshes.forEach((m, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(m); });
  let best = null;
  for (const g of groups.values()) if (!best || g.length > best.length) best = g;
  return best || [];
}
function bakeBed(root, keep) {
  const model = new THREE.Group();
  for (const { o } of keep) {
    o.updateWorldMatrix(true, false);
    const m = new THREE.Mesh(o.geometry, o.material);
    m.applyMatrix4(o.matrixWorld);
    model.add(m);
  }
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const norm = new THREE.Group();
  model.position.set(-center.x, -box.min.y, -center.z);
  norm.add(model);
  return { norm, size: box.getSize(new THREE.Vector3()) };
}
function buildAssembly(bed, rot) {
  const g = new THREE.Group();
  const fw = rot ? FH : FW, fh = rot ? FW : FH;
  const sx = fw / bed.size.x, sz = fh / bed.size.z, sy = (sx + sz) / 2;
  const b = bed.norm.clone(true);
  b.scale.set(sx, sy, sz);
  b.position.set(fw / 2, 0, fh / 2);
  g.add(b);
  return g;
}
function renderView(assembly, rot) {
  const W = 900;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8f4a, 1.9));
  const sun = new THREE.DirectionalLight(0xfff1cc, 2.1); sun.position.set(180, 260, 120); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xc6dcff, .7); fill.position.set(-160, 140, -140); scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, .35));
  scene.add(assembly);
  const box = new THREE.Box3().setFromObject(assembly);
  const center = box.getCenter(new THREE.Vector3());
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 4000);
  camera.up.copy(CAM_UP);
  camera.position.copy(center).addScaledVector(CAM_DIR, 800);
  camera.lookAt(center);
  camera.updateMatrixWorld(true);
  const min = new THREE.Vector3(Infinity, Infinity, Infinity), max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    min.min(v); max.max(v);
  }
  const pad = 4;
  camera.left = min.x - pad; camera.right = max.x + pad;
  camera.bottom = min.y - pad; camera.top = max.y + pad;
  camera.updateProjectionMatrix();
  const H = Math.round(W * (camera.top - camera.bottom) / (camera.right - camera.left));
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#6ea84f'; g.fillRect(0, 0, W, H);
  g.drawImage(renderer.domElement, 0, 0);
  renderer.dispose(); renderer.forceContextLoss();
  return cv;
}

const gltf = await new GLTFLoader().loadAsync('assets/farm.glb');
const modes = {
  'all-green-dropped': o => isGreenGround(o),
  'drop-green-blue': o => isGreenGround(o) || isBlue(o),
  'drop-all-planes': o => isGroundPlane(o),
  'only-logs-wheat': o => isGroundPlane(o) || (o.material && o.material.color && o.material.color.getHexString() === 'ffa402' ? false : false),
};
for (const [name, skip] of Object.entries(modes)) {
  const keep = groupMeshes(gltf.scene, skip);
  const bed = bakeBed(gltf.scene, keep);
  const cv = renderView(buildAssembly(bed, 0), 0);
  const fig = document.createElement('figure');
  fig.appendChild(cv);
  const cap = document.createElement('figcaption'); cap.textContent = name + '  (' + keep.length + ' meshes)';
  fig.appendChild(cap);
  document.body.appendChild(fig);
}
document.title = 'done';
</script>
</body></html>
